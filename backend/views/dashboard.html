<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f8fafb;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .logout-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #c53030;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-box {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-box strong {
            display: block;
            font-size: 32px;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .stat-box p {
            font-size: 14px;
            color: #666;
        }

        .sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .section {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }

        .section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        .info-item {
            margin-bottom: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            color: #333;
            word-break: break-all;
        }

        .info-value a {
            color: #2563eb;
            text-decoration: none;
        }

        .info-value a:hover {
            text-decoration: underline;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .item-card {
            background: #f8fafb;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
        }

        .item-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .item-card p {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .item-card small {
            display: block;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .loading {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 24px;
        }

        .empty-message {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 24px;
            background: #f8fafb;
            border-radius: 6px;
            border: 1px dashed #e0e0e0;
        }

        .alert {
            display: none;
            background: #fee2e2;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            border: 1px solid #fc8181;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .sections {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .logout-btn {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Dashboard</h1>
                <p>Manage your portfolio content</p>
            </div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <div class="alert" id="alert"></div>

        <div class="stats">
            <div class="stat-box">
                <strong id="projectCount">0</strong>
                <p>Projects</p>
            </div>
            <div class="stat-box">
                <strong id="galleryCount">0</strong>
                <p>Gallery Items</p>
            </div>
            <div class="stat-box">
                <strong>Portfolio</strong>
                <p>Admin Panel</p>
            </div>
        </div>

        <div class="sections">
            <div class="section">
                <h2>About You</h2>
                <div id="homeContent">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="section">
                <h2>Contact Information</h2>
                <div id="contactContent">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Projects</h2>
            <div class="grid" id="projectsGrid">
                <div class="loading">Loading projects...</div>
            </div>
        </div>

        <div class="section">
            <h2>Gallery</h2>
            <div class="grid" id="galleryGrid">
                <div class="loading">Loading gallery...</div>
            </div>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alert');
        const logoutBtn = document.getElementById('logoutBtn');

        logoutBtn.addEventListener('click', async () => {
            try {
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            } catch (err) {
                console.error(err);
            }
            window.location.href = '/login';
        });

        function showAlert(message) {
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        async function fetchData(path) {
            const res = await fetch(path, { credentials: 'include' });
            if (!res.ok) {
                if (res.status === 401) {
                    window.location.href = '/login';
                    return null;
                }
                throw new Error('Failed to fetch ' + path);
            }
            return res.json();
        }

        function renderHome(data) {
            if (!data) {
                document.getElementById('homeContent').innerHTML = '<div class="empty-message">No home content</div>';
                return;
            }

            let html = `
                <div class="info-item">
                    <div class="info-label">Title</div>
                    <div class="info-value">${data.title || '-'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Description</div>
                    <div class="info-value">${data.description || '-'}</div>
                </div>
            `;
            
            if (data.imageUrl) {
                html += `
                    <div class="info-item">
                        <div class="info-label">Image</div>
                        <div class="info-value"><a href="${data.imageUrl}" target="_blank">View Image</a></div>
                    </div>
                `;
            }

            document.getElementById('homeContent').innerHTML = html;
        }

        function renderContact(data) {
            if (!data) {
                document.getElementById('contactContent').innerHTML = '<div class="empty-message">No contact info</div>';
                return;
            }

            let html = `
                <div class="info-item">
                    <div class="info-label">Email</div>
                    <div class="info-value"><a href="mailto:${data.email}">${data.email}</a></div>
                </div>
                ${data.phone ? `
                    <div class="info-item">
                        <div class="info-label">Phone</div>
                        <div class="info-value">${data.phone}</div>
                    </div>
                ` : ''}
                ${data.address ? `
                    <div class="info-item">
                        <div class="info-label">Address</div>
                        <div class="info-value">${data.address}</div>
                    </div>
                ` : ''}
                ${data.github ? `
                    <div class="info-item">
                        <div class="info-label">GitHub</div>
                        <div class="info-value"><a href="${data.github}" target="_blank">Profile</a></div>
                    </div>
                ` : ''}
                ${data.linkedin ? `
                    <div class="info-item">
                        <div class="info-label">LinkedIn</div>
                        <div class="info-value"><a href="${data.linkedin}" target="_blank">Profile</a></div>
                    </div>
                ` : ''}
                ${data.instagram ? `
                    <div class="info-item">
                        <div class="info-label">Instagram</div>
                        <div class="info-value"><a href="${data.instagram}" target="_blank">Profile</a></div>
                    </div>
                ` : ''}
                ${data.twitter ? `
                    <div class="info-item">
                        <div class="info-label">Twitter</div>
                        <div class="info-value"><a href="${data.twitter}" target="_blank">Profile</a></div>
                    </div>
                ` : ''}
            `;

            document.getElementById('contactContent').innerHTML = html;
        }

        function renderProjects(projects) {
            const container = document.getElementById('projectsGrid');
            
            if (!projects || projects.length === 0) {
                container.innerHTML = '<div class="empty-message" style="grid-column: 1/-1;">No projects yet</div>';
                return;
            }

            container.innerHTML = projects.map(project => `
                <div class="item-card">
                    <h3>${project.title || 'Untitled'}</h3>
                    <p>${project.description || 'No description'}</p>
                    ${project.technologies && project.technologies.length > 0 ? `
                        <small><strong>Tech:</strong> ${project.technologies.join(', ')}</small>
                    ` : ''}
                    ${project.githubLink ? `
                        <div style="margin-top: 8px;">
                            <a href="${project.githubLink}" target="_blank" style="font-size: 12px;">→ GitHub</a>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderGallery(items) {
            const container = document.getElementById('galleryGrid');
            
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-message" style="grid-column: 1/-1;">No gallery items yet</div>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="item-card">
                    <h3>${item.title || 'Untitled'}</h3>
                    <p>${item.description || 'No description'}</p>
                    ${item.category ? `
                        <small><strong>Category:</strong> ${item.category}</small>
                    ` : ''}
                    ${item.url ? `
                        <div style="margin-top: 8px;">
                            <a href="${item.url}" target="_blank" style="font-size: 12px;">→ View</a>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function loadDashboard() {
            try {
                const [homeRes, projectsRes, galleryRes, contactRes] = await Promise.all([
                    fetchData('/api/admin/home'),
                    fetchData('/api/admin/projects'),
                    fetchData('/api/admin/gallery'),
                    fetchData('/api/admin/contact'),
                ]);

                if (homeRes) {
                    renderHome(homeRes.data);
                }

                if (contactRes) {
                    renderContact(contactRes.data);
                }

                const projects = projectsRes?.data || [];
                const gallery = galleryRes?.data || [];

                document.getElementById('projectCount').textContent = projects.length;
                document.getElementById('galleryCount').textContent = gallery.length;

                renderProjects(projects);
                renderGallery(gallery);
            } catch (error) {
                showAlert('Failed to load dashboard data. Please refresh or login again.');
                console.error(error);
            }
        }

        // Load dashboard on page load
        loadDashboard();
    </script>
</body>
</html>
